<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Successful</title>
  <link rel="shortcut icon" href="images/psportslogo.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: "Segoe UI", sans-serif;
    }

    .success-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h2 {
      color: #2e7d32;
    }

    p {
      color: #555;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #fb641b;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }

    .button:hover {
      background: #e75b17;
    }
  </style>
</head>

<body>

<div class="success-box">
  <h2>✅ Payment Successful</h2>
  <p>Thank you for your purchase.</p>
  <p>Your order has been placed successfully.</p>

  <a href="index.html" class="button">Continue Shopping</a>
</div>

</body>
</html>
