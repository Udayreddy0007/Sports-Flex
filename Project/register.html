<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Flex Register</title>
    <link rel="stylesheet" href="styles/site11.css">
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Register</h2>
        <p class="login-subtitle">Create your SportsFlex account</p>

        <form id="register-form">
            <input type="text" id="reg-username" placeholder="Username" required>
            <input type="password" id="reg-password" placeholder="Password" required>
            <button type="button" onclick="registerUser()">Register</button>
            <div id="register-error"></div>
        </form>
    </div>

    <script>
        function registerUser() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const errorDiv = document.getElementById('register-error');

            if (!username || !password) {
                errorDiv.textContent = "Please fill in both fields.";
                errorDiv.style.color = "red";
                return;
            }

            // Save to localStorage
            localStorage.setItem('sf_username', username);
            localStorage.setItem('sf_password', password);

            // Redirect to login
            alert("Registration successful! Please login.");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
