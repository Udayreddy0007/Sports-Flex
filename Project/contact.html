<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Flex - Contact Us</title>
    <link href="styles/site.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="images/Sports Flexlogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        /* Body & Background */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        /* Top Navigation (BLACK STYLE) */
        .topnav {
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
        }

        .topnav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-right: 1px solid #555;
        }

        .topnav a:last-child {
            border-right: none;
        }

        .topnav a:hover {
            background-color: #555;
        }

        .topnav a.current {
            background-color: grey;
        }

        /* Date Display */
        .date00 {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            color: #333;
        }

        /* Main Contact Container */
        #main {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        #main h1 {
            color: #1e3c72;
            margin-bottom: 10px;
        }

        #main p {
            color: #555;
            margin-bottom: 30px;
        }

        /* Contact Form */
        #contact1 input, #contact1 textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        #contact1 input:focus, #contact1 textarea:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        #contact1 button {
            padding: 12px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        #contact1 button:hover {
            background: #555;
            transform: scale(1.02);
        }
.social-icons a {
    font-size: 28px;
    color: black;
    transition: all 0.3s ease;
}

.social-icons a:hover {
    color: black;
}

    </style>
</head>
<body>

    <!-- Top Nav -->
    <div class="topnav" id="myTopnav">
        <a href="index.html">Home</a>
        <a href="brands.html">Brands</a>
        <a href="contact.html" class="current">Contact Us</a>
        <a href="about.html">About</a>
        <a href="register.html">Register Here</a>
    </div>

    <!-- Date -->
    <div class="date00">
        <script>
            var now = new Date();
            var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            var date = (now.getDate()<10 ? "0" : "") + now.getDate();
            function fourdigits(number){ return (number < 1000) ? number + 1900 : number; }
            var today = days[now.getDay()] + ", " + months[now.getMonth()] + " " + date + ", " + fourdigits(now.getYear());
            document.write(today);
        </script>
    </div>

    <!-- Contact Form -->
    <div id="main">
        <h1>Contact Us</h1>
        <p>Feel free to reach out to us for any queries or support.</p>

        <form id="contact1">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="6" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <!-- Social Media -->
        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank" class="fa fa-facebook"></a>
            <a href="https://www.instagram.com" target="_blank" class="fa fa-instagram"></a>
        </div>
    </div>

</body>
</html>
