<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Psports - Secure Payment</title>
  <link rel="shortcut icon" href="images/psportslogo.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkout-container {
      width: 100%;
      max-width: 600px;
      background: #f1f3f6;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
    }

    .pay-btn {
      width: 100%;
      background: #fb641b;
      color: #fff;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="checkout-container">
  <h2>Secure Checkout</h2>

  <form id="form1">
    <button type="submit" class="pay-btn">Pay Now</button>
  </form>
</div>

<!-- Razorpay MUST be loaded FIRST -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  // 🔹 READ PRODUCT DATA FROM URL
  const params = new URLSearchParams(window.location.search);
  const productName = params.get("name");
  const price = params.get("price"); // price in USD

  document.getElementById("form1").addEventListener("submit", async function (e) {
    e.preventDefault();

    try {
      // 1️⃣ CREATE ORDER WITH DYNAMIC PRICE
      const response = await fetch("http://localhost:5000/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          price: price,
          productName: productName
        })
      });

      const order = await response.json();

      // 2️⃣ RAZORPAY OPTIONS
      const options = {
        key: "rzp_test_S9NJPJnQOgjt28",
        amount: order.amount,
        currency: "INR",
        name: "Psports",
        description: productName,
        order_id: order.id,

        handler: async function (response) {
          // 3️⃣ VERIFY PAYMENT
          const verify = await fetch("http://localhost:5000/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response)
          });

          const result = await verify.json();

          if (result.success) {

            /* ===============================
               ✅ ADDED: SAVE ORDER TO CART
            =============================== */
            const orders = JSON.parse(localStorage.getItem("orders")) || [];

            orders.push({
              name: productName,
              price: price,
              date: new Date().toLocaleString()
            });

            localStorage.setItem("orders", JSON.stringify(orders));
            /* =============================== */

            alert("✅ Payment Successful");
            window.location.href = "passwordsuccess.html"; // ✅ changed from password page
          } else {
            alert("❌ Payment Verification Failed");
          }
        },

        theme: { color: "#fb641b" }
      };

      const rzp = new Razorpay(options);
      rzp.open();

    } catch (err) {
      alert("Server error. Try again.");
      console.error(err);
    }
  });
</script>

</body>
</html>
